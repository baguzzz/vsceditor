name: Build VSCE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache sementara DINONAKTIFKAN untuk membuang cache lama (167 MB)
      # yang menyimpan metadata resolusi plugin yang sudah basi.
      # Setelah build sukses sekali, hapus baris "cache-disabled: true"
      # agar build berikutnya cepat kembali.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Diagnose Gradle configuration
        working-directory: vsce
        run: |
          echo "=== PWD ==="
          pwd
          echo ""
          echo "=== Isi folder vsce ==="
          ls -la
          echo ""
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo ""
          echo "=== build.gradle.kts (root project) ==="
          cat build.gradle.kts
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== Semua settings.gradle.kts di repo ==="
          find .. -name "settings.gradle.kts" -not -path "*/build/*" -not -path "*/.git/*"

      - name: Make gradlew executable
        working-directory: vsce
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: vsce
        run: ./gradlew assembleDebug --refresh-dependencies --stacktrace --no-build-cache

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: vsce/app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # Langkah release — hanya berjalan saat push tag (mis. v1.0.0)
      # ============================================================
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: vsce
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: vsce
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: vsce/app/build/outputs/apk/release/app-release.apk
