name: Build VSCE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
       - name: Make gradlew executable
        working-directory: vsce
        run: chmod +x gradlew
        
      - name: Build Debug APK
        working-directory: vsce          # <-- Jalankan dari dalam folder vsce
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: vsce/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: vsce          # <-- Path keystore relatif terhadap vsce
        run: echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: vsce          # <-- Jalankan dari dalam folder vsce
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: vsce/app/build/outputs/apk/release/app-release.apk
