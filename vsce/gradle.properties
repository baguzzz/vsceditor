# Wajib untuk AndroidX (Compose, sora-editor, activity-compose)
android.useAndroidX=true

# Nonaktifkan Jetifier karena semua dependency sudah AndroidX-native
# (menghemat waktu build dan memori)
android.enableJetifier=false

# Peringatan compileSdk 35 pada AGP 8.5.2 (bisa diabaikan)
# AGP 8.5.2 diuji hingga compileSdk 34, tetapi tetap bisa kompilasi 35
android.suppressUnsupportedCompileSdk=35

# Pengaturan Gradle untuk performa
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
